services:
  backend:
    build: ./backend
    container_name: ai_backend
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/code
    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ai_frontend
    ports:
      - "8081:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg16
    container_name: ai_postgres
    env_file:
      - .env
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aichatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  frontend_node_modules: